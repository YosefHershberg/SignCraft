# CI for SignCraft. Deployment is not done here: Vercel's GitHub integration builds a
# preview for every PR and a production deployment for every push to main (README › CI/CD).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch supersedes the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '24' # the Vercel project's Node.js version (24.x)
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-test-db: ${{ steps.test-db.outputs.present }}
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall runs `prisma generate`; pnpm-workspace.yaml `allowBuilds` lets it.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # No secrets needed: the page and GET routes are force-dynamic, so nothing
      # touches Atlas or R2 at build time.
      - run: pnpm build

      - name: Check for the integration-test database
        id: test-db
        run: |
          if [ "${{ secrets.TEST_DATABASE_URL != '' }}" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration tests skipped::TEST_DATABASE_URL is not set (fork PRs never receive secrets). See README › CI/CD."
          fi

  integration:
    name: Integration tests (Atlas)
    needs: verify
    if: needs.verify.outputs.has-test-db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every run wipes the same signcraft_test database, so runs queue rather than overlap.
    concurrency:
      group: integration-db
      cancel-in-progress: false
    env:
      # Must name a *_test database; tests/helpers/db-name.ts refuses anything else.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Creates the collections and indexes (the unique ones matter to the tests) on a
      # fresh test database; a no-op when they already exist. Mongo has no migrations.
      - run: pnpm db:push

      # R2 is mocked at lib/storage/r2.ts, so no R2 secrets are needed.
      - run: pnpm test:integration
