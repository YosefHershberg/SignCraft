# The app container only. The database is MongoDB Atlas (a replica set, which Prisma on
# Mongo and change streams both require); put its SRV string in .env as DATABASE_URL.
services:
  app:
    build: .
    # APP_PORT lets you publish elsewhere (e.g. 3001) when 3000 is taken by `pnpm dev`.
    ports: ["${APP_PORT:-3000}:3000"]
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: http://localhost:${APP_PORT:-3000}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      CLAIM_TTL_MS: ${CLAIM_TTL_MS:-180000}
