services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\""]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
  app:
    build: .
    # APP_PORT lets you publish elsewhere (e.g. 3001) when 3000 is taken by `pnpm dev`.
    ports: ["${APP_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: mongodb://mongo:27017/signcraft?directConnection=true
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      CLAIM_TTL_MS: ${CLAIM_TTL_MS:-180000}
    depends_on:
      mongo: { condition: service_healthy }
volumes:
  mongo-data: {}
